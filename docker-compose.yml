services:
  app:
    build: .
    ports:
      - "8472:8472"
    environment:
      - PORT=8472
      - DATABASE_URL=/app/data/fixedflow.db
      # Set ORIGIN to your public URL (e.g. https://fixedflow.example.com) if you
      # want to re-enable SvelteKit's CSRF origin check while behind a reverse proxy.
      # - ORIGIN=https://your-tailscale-hostname
    volumes:
      - fixedflow-data:/app/data
    restart: unless-stopped

volumes:
  fixedflow-data:
