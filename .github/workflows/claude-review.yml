name: Claude Code — Review PR

# Automatically reviews every opened or updated PR.
# After reviewing:
#   - APPROVE  → merges the PR via GH_PAT
#   - REQUEST_CHANGES → checks out the branch, runs Claude to fix, pushes via GH_PAT
#     (the push triggers this workflow again, creating a self-correcting loop)
#
# Note: merge and fix are handled in the same job rather than a separate workflow
# because GitHub suppresses pull_request_review events generated by GITHUB_TOKEN,
# so a downstream workflow would never trigger.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write PR diff to file
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          claude -p "
          You are reviewing a pull request for the FixedFlow project.
          Read CLAUDE.md for project conventions and standards.

          PR #${PR_NUMBER}: ${PR_TITLE}
          PR description: ${PR_BODY}

          The diff is at /tmp/pr.diff — read it with the Read tool before reviewing.

          Provide a thorough code review covering:
          1. Correctness — does the implementation match the PR description and issue?
          2. Security — XSS, SQL injection, hardcoded secrets, input validation
          3. Simplicity — unnecessary complexity, premature abstraction
          4. Conventions — does it follow CLAUDE.md standards?
          5. Tests — are non-trivial changes covered?

          Format your review as markdown.
          Mark non-blocking suggestions clearly as '(suggestion)'.
          Mark required changes clearly as '**Required:**'.

          At the very end of your response, on its own line, write exactly one of:
            VERDICT: APPROVE
            VERDICT: REQUEST_CHANGES
          " --dangerously-skip-permissions --allowedTools "Read,Glob,Grep" > /tmp/review-raw.txt

          cat /tmp/review-raw.txt

      - name: Submit formal review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if grep -q "VERDICT: APPROVE" /tmp/review-raw.txt; then
            VERDICT="approve"
          else
            VERDICT="request-changes"
          fi

          grep -v "^VERDICT:" /tmp/review-raw.txt > /tmp/review-body.md

          echo "Submitting review with verdict: $VERDICT"
          gh pr review "${PR_NUMBER}" --repo "${REPO}" \
            --"${VERDICT}" \
            --body-file /tmp/review-body.md

          echo "verdict=${VERDICT}" >> $GITHUB_OUTPUT

      # ── Approve path: merge the PR ────────────────────────────────────────────
      - name: Merge PR
        if: steps.review.outputs.verdict == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPO}" \
            --squash \
            --delete-branch \
            --subject "$(gh pr view ${PR_NUMBER} --repo ${REPO} --json title --jq .title)"

      # ── Changes-requested path: fix and push (triggers review loop) ───────────
      - name: Configure git for fix push
        if: steps.review.outputs.verdict == 'request-changes'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Claude Code Agent"
          git config user.email "claude-agent@users.noreply.github.com"
          # Use GH_PAT so the push triggers the pull_request synchronize event
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${REPO}.git"

      - name: Fetch review comments
        if: steps.review.outputs.verdict == 'request-changes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body' \
            > /tmp/review-comments.txt

          gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '.[] | "File: \(.path) (line \(.line // "N/A"))\n\(.body)\n"' \
            >> /tmp/review-comments.txt

          echo "Review comments to fix:"
          cat /tmp/review-comments.txt

      - name: Fix review issues
        if: steps.review.outputs.verdict == 'request-changes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          claude -p "
          You are fixing issues raised in a code review for the FixedFlow project.
          Read CLAUDE.md for project conventions.

          PR #${PR_NUMBER}: ${PR_TITLE}

          The review comments requesting changes are in /tmp/review-comments.txt — read that file first.

          Then:
          1. Read the relevant source files to understand the current code
          2. Fix every issue marked as Required in the review
          3. Apply any clearly correct suggestions
          4. Run 'npm run check' and 'npm run lint' if they exist — fix any errors
          5. Commit all fixes with a message like 'fix: address review comments on PR #${PR_NUMBER}'
          6. Push with: git push origin HEAD

          Do not make changes beyond what the review requested.
          Do not modify CLAUDE.md.
          " --dangerously-skip-permissions --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
