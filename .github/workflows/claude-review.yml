name: Claude Code — Review PR

# Automatically reviews every opened or updated PR.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "PR_DIFF<<EOF" >> $GITHUB_ENV
          head -c 8000 /tmp/pr.diff >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          REVIEW=$(claude -p "
          You are reviewing a pull request for the FixedFlow project.
          Read CLAUDE.md for project conventions and standards.

          PR #${PR_NUMBER}: ${PR_TITLE}
          PR description: ${PR_BODY}

          Diff:
          ${PR_DIFF}

          Provide a thorough code review covering:
          1. Correctness — does the implementation match the PR description and issue?
          2. Security — XSS, SQL injection, hardcoded secrets, input validation
          3. Simplicity — unnecessary complexity, premature abstraction
          4. Conventions — does it follow CLAUDE.md standards?
          5. Tests — are non-trivial changes covered?

          Format your review as markdown.
          Mark non-blocking suggestions clearly as '(suggestion)'.
          Mark required changes clearly as '**Required:**'.
          End with either '✅ Approved' or '🔄 Changes requested' and a one-line summary.
          " --dangerously-skip-permissions --allowedTools "Read,Glob,Grep")

          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${REVIEW}"
