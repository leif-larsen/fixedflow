name: Claude Code — Merge or Fix

# On approval: auto-merge the PR.
# On changes requested: run Claude to fix the issues, then push.
# The fix triggers the review workflow again automatically (via pull_request synchronize).

on:
  pull_request_review:
    types: [submitted]

jobs:
  # ── Auto-merge on approval ──────────────────────────────────────────────────
  merge:
    name: Merge approved PR
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPO}" \
            --squash \
            --delete-branch \
            --subject "$(gh pr view ${PR_NUMBER} --repo ${REPO} --json title --jq .title)"

  # ── Auto-fix on changes requested ──────────────────────────────────────────
  fix:
    name: Fix review comments
    if: github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name "Claude Code Agent"
          git config user.email "claude-agent@users.noreply.github.com"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Get the review body that requested changes
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body' \
            > /tmp/review-comments.txt

          # Also get any inline comments
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '.[] | "File: \(.path) (line \(.line // "N/A"))\n\(.body)\n"' \
            >> /tmp/review-comments.txt

          echo "Review comments:"
          cat /tmp/review-comments.txt

      - name: Fix issues
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          claude -p "
          You are fixing issues raised in a code review for the FixedFlow project.
          Read CLAUDE.md for project conventions.

          PR #${PR_NUMBER}: ${PR_TITLE}

          The review comments requesting changes are in /tmp/review-comments.txt — read that file first.

          Then:
          1. Read the relevant source files to understand the current code
          2. Fix every issue marked as Required in the review
          3. Apply any clearly correct suggestions
          4. Run 'npm run check' and 'npm run lint' if they exist — fix any errors
          5. Commit all fixes with a message like 'fix: address review comments on PR #${PR_NUMBER}'
          6. Push with: git push origin HEAD

          Do not make changes beyond what the review requested.
          Do not modify CLAUDE.md.
          " --dangerously-skip-permissions --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
