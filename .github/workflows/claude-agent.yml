name: Claude Code Agent

# Responds to @claude mentions in issue and PR comments.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    name: Respond to @claude mention
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Respond to comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          RESPONSE=$(claude -p "
          You are the Claude Code agent for the FixedFlow project.
          Read CLAUDE.md for full project context.

          A user has mentioned you in a GitHub issue/PR comment.

          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}
          Issue description: ${ISSUE_BODY}

          The comment mentioning you:
          ${COMMENT_BODY}

          Please respond helpfully. If they are asking you to plan an implementation,
          provide a clear, specific plan. If they ask a question, answer it.
          Keep your response concise and focused.
          " --dangerously-skip-permissions --allowedTools "Read,Glob,Grep")

          # Post response as a comment
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "${RESPONSE}"
